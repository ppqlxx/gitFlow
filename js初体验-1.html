<!DOCTYPE html>
<html>

<head <meta charset="UTF-8" />
<title>title</title>
<!--2、内嵌式的Js-->
<style>
    .box {
        width: 50px;
        height: 50px;
        background-color: pink;
    }

    .change {
        background-color: purple;
        margin-top: 100px;
        width: 100px;
    }
</style>
</head>

<body>
    <div class="box">淘宝二维码
    </div>
    <script>
        // 通过className来修改样式
        var box = document.querySelector('.box');
        box.onclick = function () {
            //让当前元素的类名变成了change
            box.className = 'change';
        }
    </script>
</body>

</html>
