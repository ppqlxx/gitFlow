<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>表单全选或者取消全选</title>
</head>

<body>
    <div id="wrap">
        <table>
            <thead>
                <tr>
                    <th>
                        <input type="checkbox" id="j_cbAll">
                    </th>
                    <th>商品</th>
                    <th>价钱</th>
                </tr>
            </thead>

            <tbody id="j_tb">
                <tr>
                    <td><input type="checkbox"></td>
                    <td>iphone8</td>
                    <td>8000</td>
                </tr>
                <tr>
                    <td><input type="checkbox"></td>
                    <td>iphone7</td>
                    <td>7000</td>
                </tr>
                <tr>
                    <td><input type="checkbox"></td>
                    <td>iphone6</td>
                    <td>6000</td>
                </tr>
            </tbody>
        </table>

    </div>
    <script>
        // 全选或取消全选 让下面所有复选框的checkbox属性（选中状态）跟随全选按钮即可
        // 获取元素
        var j_cbAll = document.getElementById('j_cbAll');
        var j_tb = document.getElementById('j_tb');
        var j_tbs = j_tb.getElementsByTagName('input');
        console.log(j_tbs);
        j_cbAll.onclick = function () {
            // this.checked可以得到当前check的状态
            console.log(this.checked);
            for (var i = 0; i < j_tbs.length; i++) {
                j_tbs[i].checked = this.checked;
            }
        }

        // 下面复选框需要全部选中，上面全选才能选中做法
        // 给下面绑定点击事件，每次点击，都要循环查看下面所有复选框是否有没有选中的
        for (var j = 0; j < j_tbs.length; j++) {
            j_tbs[j].onclick = function () {
                var flag = true;
                // 每次点击都要循环检查小按钮是否被点击
                for (var k = 0; k < j_tbs.length; k++) {
                    if (!j_tbs[k].checked) {
                        flag = false;
                    }
                }
                j_cbAll.checked = flag;
            }
        }
    </script>
</body>

</html>
