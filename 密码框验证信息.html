<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>title</title>
    <style>
        div {
            width: 600px;
            margin: 100px auto;
        }

        .message {
            display: inline-block;
            font-style: 12px;
            color: #999;
            background: url(img/2.png) no-repeat left center;
            background-size: 10%;
            padding-left: 20px;
        }

        .wrong {
            color: red;
            background-image: url(img/1.jpg);
        }

        .right {
            color: green;
            background-image: url(img/2.jpg);
        }
    </style>
</head>

<body>
    <div><input type="password" class="ipt">
        <p class="message">请输入5-15位密码</p>
    </div>
    <script>
        var ipt = document.querySelector('.ipt');
        var message = document.querySelector('.message');
        ipt.onblur = function () {
            if (this.value.length < 6 || this.value.length > 16) {
                message.className = 'message wrong';
                message.innerHTML = '输入有误';
            }
            else {
                message.className = 'message right';
                message.innerHTML = 'bingo';
            }
        }
    </script>
</body>

</html>
